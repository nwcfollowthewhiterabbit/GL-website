name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Run foundation tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate repository
        run: python scripts/check_repository.py
      - name: Install Node dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test account authentication
        run: npm run test:account
      - name: Test integration contracts
        run: npm run test:integration
      - name: Test observability
        run: npm run test:observability
      - name: Test payment adapter
        run: npm run test:payments
      - name: Build storefront
        run: npm run build
