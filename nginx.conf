server {
  listen 8080;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.google.com https://www.google.com.fj; upgrade-insecure-requests" always;

  location = /how-we-operate {
    try_files /how-we-operate/index.html =404;
  }

  location = /about-us {
    try_files /about-us/index.html =404;
  }

  location = /catalog {
    try_files /catalog/index.html =404;
  }
  location ~ ^/(?:catalog(?:/[^/]+)?(?:/[^/]+)?|account|about|privacy|privacy-policy|terms|terms-and-conditions|shipping|delivery|returns|refunds|cancellation|payment-security|checkout)/?$ {
    try_files /index.html =404;
  }
  location = /__storefront_shell {
    internal;
    alias /usr/share/nginx/html/index.html;
    default_type text/html;
  }
  location = /sitemap.xml {
    proxy_set_header X-Storefront-Origin "__PUBLIC_SITE_URL__";
    proxy_pass http://api:3000;
  }
  location ^~ /products/ {
    proxy_pass http://api:3000;
  }
  location / {
    try_files $uri $uri/ @legacy_page;
  }
  location @legacy_page {
    proxy_pass http://api:3000;
  }

  location ^~ /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /theme-init.js {
    expires -1;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
}
